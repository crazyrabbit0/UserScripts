name: Bug report
description: A script does not work as expected
labels: [bug]
assignees: [crazyrabbit0]
body:
  - type: dropdown
    id: script
    attributes:
      label: Script
      options:
        - Distill - Simulate Tab Visibility
        - MEGA TV - Episode Navigation
        - Narto Drama - Bypass Ads
        - YouTube Music - Mark All Podcast Episodes as Played
        - YouTube Playlist AutoPlay
        - YouTube Remove Important Notifications
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and userscript manager
      placeholder: Chrome 130, Tampermonkey 5.3
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happens, and what did you expect?
      description: Include any errors from the browser console (F12).
    validations:
      required: true
