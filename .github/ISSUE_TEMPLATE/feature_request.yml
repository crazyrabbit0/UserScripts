name: Feature request
description: Suggest an improvement or a new script
labels: [enhancement]
assignees: [crazyrabbit0]
body:
  - type: input
    id: script
    attributes:
      label: Script or site
      placeholder: YouTube Playlist AutoPlay, or a new site
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should it do?
    validations:
      required: true
